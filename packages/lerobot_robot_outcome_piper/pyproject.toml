[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_outcome_piper"
version = "0.1.0"
description = "PiPER-only LeRobot robot, Xbox teleoperator, and action processor"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "lerobot[core-scripts,gamepad,intelrealsense] @ git+https://github.com/huggingface/lerobot.git@30da8e687a6dfc617fcd94afc367ac7071c376ce",
    "pyAgxArm @ git+https://github.com/agilexrobotics/pyAgxArm.git@799b8412fbe8b9156bc9892d3dbeb2df7e98be71 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "scipy>=1.16,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
