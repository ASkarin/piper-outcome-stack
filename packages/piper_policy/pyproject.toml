[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "piper-policy"
version = "0.1.0"
description = "Hardware-independent PiPER ACT and SmolVLA policy interfaces"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2,<2.3",
  "torch>=2.7,<2.12",
  "torchvision>=0.22,<0.27",
  "lerobot[training,smolvla] @ git+https://github.com/huggingface/lerobot.git@30da8e687a6dfc617fcd94afc367ac7071c376ce",
]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
