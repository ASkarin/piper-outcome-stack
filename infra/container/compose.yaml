name: piper-outcome-stack

services:
  training:
    image: "${PIPER_IMAGE:?set PIPER_IMAGE in .env}"
    container_name: piper-outcome-stack-training
    hostname: piper-training
    entrypoint:
      - /usr/bin/tini
      - --
      - /opt/piper/container-runtime/entrypoint.sh
    restart: unless-stopped
    gpus:
      - driver: nvidia
        count: 3
    shm_size: "16gb"
    stop_grace_period: 90s
    ports:
      - "${PIPER_SSH_BIND:?set PIPER_SSH_BIND in .env}:22"
    volumes:
      - type: bind
        source: "${PIPER_WORKSPACE_HOST:?set PIPER_WORKSPACE_HOST in .env}"
        target: /workspace
        bind:
          create_host_path: false
      - type: bind
        source: "${PIPER_SSH_HOST_KEYS_HOST:?set PIPER_SSH_HOST_KEYS_HOST in .env}"
        target: /etc/ssh/piper_host_keys
        bind:
          create_host_path: false
      - type: bind
        source: "${PIPER_AUTH_KEYS_HOST:?set PIPER_AUTH_KEYS_HOST in .env}"
        target: /run/piper-config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./entrypoint.sh
        target: /opt/piper/container-runtime/entrypoint.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./init-shared-python.sh
        target: /opt/piper/container-runtime/init-shared-python.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./profile.sh
        target: /opt/piper/container-runtime/profile.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./bin
        target: /opt/piper/container-runtime/bin
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./lib
        target: /opt/piper/container-runtime/lib
        read_only: true
        bind:
          create_host_path: false
    environment:
      PIPER_ADMIN_USER: "${PIPER_ADMIN_USER:?set PIPER_ADMIN_USER in .env}"
      PIPER_ADMIN_UID: "${PIPER_ADMIN_UID:?set PIPER_ADMIN_UID in .env}"
      PIPER_COLLAB_USER: "${PIPER_COLLAB_USER:?set PIPER_COLLAB_USER in .env}"
      PIPER_COLLAB_UID: "${PIPER_COLLAB_UID:?set PIPER_COLLAB_UID in .env}"
      PIPER_GROUP_GID: "${PIPER_GROUP_GID:?set PIPER_GROUP_GID in .env}"
      PIPER_GROUP_NAME: piper
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
      WANDB_MODE: offline
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
      stack:
        soft: 67108864
        hard: 67108864
    healthcheck:
      test: ["CMD-SHELL", "/usr/sbin/sshd -t -f /run/sshd_config && test -x /workspace/piper/python-env/bin/python"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
